version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: retail_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-retail_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retail_pw}
      POSTGRES_DB: ${POSTGRES_DB:-retail_insights}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-retail_admin}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

retail_insights:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      user: "{{ env_var('POSTGRES_USER', 'retail_admin') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'retail_pw') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      dbname: "{{ env_var('POSTGRES_DB', 'retail_insights') }}"
      schema: analytics
      threads: 4
